<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Agent Quota Settings</title>
  <link rel="icon" href="/gauge.svg" type="image/svg+xml">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-icon" src="/gauge.svg" alt="">
        <div>
          <strong>Agent Quota</strong>
          <span>Settings</span>
        </div>
      </div>
      <nav class="nav" aria-label="Settings">
        <button class="nav-item" data-tab="general" type="button">
          <span class="nav-glyph">◇</span><span>General</span>
        </button>
        <button class="nav-item" data-tab="providers" type="button">
          <span class="nav-glyph">◎</span><span>Providers</span>
        </button>
        <button class="nav-item" data-tab="layout" type="button">
          <span class="nav-glyph">▦</span><span>Layout</span>
        </button>
        <button class="nav-item" data-tab="appearance" type="button">
          <span class="nav-glyph">◐</span><span>Appearance</span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <span class="server-dot" id="server-dot"></span>
        <span id="server-state">Connecting…</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">GNOME extension</p>
          <h1 id="page-title">General</h1>
        </div>
        <div class="topbar-actions">
          <span class="save-status" id="save-status"></span>
          <button class="button ghost" id="refresh" type="button">Refresh</button>
          <button class="button ghost" id="stop-server" type="button">Stop server</button>
        </div>
      </header>
      <div id="content" class="content" aria-live="polite">
        <div class="loading">Loading settings…</div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="settings.js"></script>
</body>
</html>
